version: '3.8'

services:
  auditor-digemid:
    build: .
    container_name: auditor_digemid_aporte
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ocr_cache_volume:/app/.ocr_cache
      - reports_volume:/app/reports
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_HEADLESS=true

volumes:
  ocr_cache_volume:
  reports_volume:
